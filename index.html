<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA MARKET AI - Development UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background simulation for local testing -->
    <div class="quotex-bg-simulator"></div>

    <!-- MAIN NOVA AI OVERLAY (This will be injected by bookmarklet later) -->
    <div id="nova-ai-overlay">
        
        <!-- Floating Robot Avatar -->
        <div class="nova-robot-container" id="nova-robot-avatar">
            <div class="drag-tooltip">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 5v14M5 12h14M12 5l-3 3M12 5l3 3M5 12l3-3M5 12l3 3M19 12l-3-3M19 12l-3 3"/></svg>
                Drag to move
            </div>
            <div class="robot-circle">
                <div class="robot-face">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="mouth"></div>
                </div>
                <div class="badge-n">N</div>
            </div>
            <button class="close-robot">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Glassmorphism Control Panel -->
        <div class="nova-panel" id="nova-main-panel">
            <!-- Header -->
            <div class="panel-header">
                <div class="header-left">
                    <div class="logo-circle">N</div>
                    <div class="header-titles">
                        <h2>NOVA MARKET AI</h2>
                        <p>Smart Market Scanner</p>
                    </div>
                </div>
                <button class="btn-close-panel">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Tabs -->
            <div class="panel-tabs">
                <button class="tab-btn active">Scan</button>
                <button class="tab-btn">History</button>
                <button class="tab-btn">Settings</button>
            </div>

            <!-- Content Area (Scan Mode) -->
            <div class="panel-content">
                <!-- Market Selector -->
                <div class="input-section">
                    <label><span class="dot cyan"></span> Market</label>
                    <div class="custom-select">
                        <div class="select-value">
                            <span class="flag-icon">🇺🇸/🇪🇺</span> EUR/USD
                        </div>
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                </div>

                <!-- Timeframe Selector -->
                <div class="input-section">
                    <label><span class="dot green"></span> Timeframe</label>
                    <div class="custom-select">
                        <div class="select-value">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                            1 minute
                        </div>
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                </div>

                <!-- START SCAN Button -->
                <button class="btn-start-scan">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    START SCAN
                </button>

                <!-- Scan Mode Toggle -->
                <div class="input-section mt-15">
                    <label><span class="dot green"></span> Scan Mode</label>
                    <div class="mode-toggle">
                        <button class="mode-btn active">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                            Manual
                        </button>
                        <button class="mode-btn">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.63-6.37L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 1 0-2.63 6.37L3 16"/></svg>
                            Auto Repeat
                        </button>
                    </div>
                </div>

                <!-- Status Indicator Box -->
                <div class="status-box">
                    <div class="status-ring">
                        <div class="ring-inner"></div>
                    </div>
                    <div class="status-text">
                        <h3>Ready to scan</h3>
                        <p>Click START SCAN to begin analysis</p>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="panel-footer">
                <div class="footer-logo">
                    <div class="mini-robot"></div>
                    <span>NOVA AI • Trade Smarter</span>
                </div>
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 20V10M12 20V4M6 20v-4"/></svg>
            </div>
        </div>
        
    </div>
</body>
</html>
